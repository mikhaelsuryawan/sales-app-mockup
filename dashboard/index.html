<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIM Sales Console</title>
<meta name="theme-color" content="#F1F0F1">
<script>try{if(localStorage.getItem('sim-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ===== Tokens: WIT style v2, accent swapped from WIT red to the SIM blue used in the mobile app ===== */
:root{
  --void:#E4E3E6; --canvas:#F1F0F1; --card:#FFFFFF; --raised:#F5F4F6; --control:#ECEBEE; --hover:#E4E3E6;
  --line:#E6E5E7; --line-strong:#D9D8DC;
  --fg:#101112; --body:#333333; --muted:#686868; --subtle:#8B8B8B;
  --invert:#101112; --on-invert:#FFFFFF; --ink:#101112; --on-ink:#FFFFFF;
  --accent:#0A92F2; --accent-strong:#0A6FE0; --accent-text:#0A62C9; --accent-soft:#E7F2FE;
  --accent-grad:linear-gradient(180deg,#21CFF7 0%,#0A92F2 45%,#3466FF 100%);
  --info:#EFA477; --info-text:#9A4E24; --info-soft:#FDF1E8;
  --success:#047857; --success-soft:#D1FAE5; --warning:#975000; --warning-soft:#FEF3C7; --danger:#C9141B; --danger-soft:#FDECED;
  --pop-blue:#0A6FE0; --pop-tan:#F6C29C; --pop-ink:#101112; --pop-sky:#D3EAFD; --pop-mist:#E6E5E7;
  --s1:#0A92F2; --s2:#E07B3C; --s3:#123F75; --s4:#14A38B; --s5:#9B5DE5; --s0:#C0C0C0;
  --st-h:#0FA968; --st-t:#F2A11F; --st-c:#0A92F2; --st-s:#9B5DE5; --st-o:#D9D8DC; --st-b:#E5484D; --st-p:#E07B3C;
  --r-card:24px; --r-panel:18px; --r-tile:14px;
  --shadow-card:0 1px 2px rgb(16 17 18 / .03),0 8px 24px -12px rgb(16 17 18 / .12);
  --shadow-float:0 12px 40px -12px rgb(16 17 18 / .25);
  --shadow-glow:0 10px 24px -8px rgb(10 120 240 / .5);
  --hatch-line:rgb(16 17 18 / .07);
  --font:'DM Sans',ui-sans-serif,system-ui,Arial,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
:root[data-theme='dark']{
  color-scheme:dark; --hatch-line:rgb(255 255 255 / .055);
  --void:#070708; --canvas:#0D0D0F; --card:#151517; --raised:#1C1C1F; --control:#242428; --hover:#2C2C31;
  --line:#232327; --line-strong:#34343B;
  --fg:#F4F4F5; --body:#C9C9CF; --muted:#94949C; --subtle:#6B6B73;
  --invert:#F4F4F5; --on-invert:#101112; --ink:#050506;
  --accent-text:#5CB8FF; --accent-soft:rgb(10 146 242 / .16);
  --info-text:#F2B48A; --info-soft:rgb(239 164 119 / .14);
  --success:#3DD68C; --success-soft:rgb(61 214 140 / .14); --warning:#FF9447; --warning-soft:rgb(255 148 71 / .14); --danger:#FF5C5C; --danger-soft:rgb(255 92 92 / .14);
  --pop-sky:#173452; --pop-mist:#2C2C31;
  --s3:#5A8BD0; --s0:#3A3A41; --st-o:#34343B;
  --shadow-card:inset 0 1px 0 rgb(255 255 255 / .035),0 1px 2px rgb(0 0 0 / .5);
  --shadow-float:0 24px 60px -16px rgb(0 0 0 / .75);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-feature-settings:'ss01','cv11';-webkit-font-smoothing:antialiased;background:var(--canvas);color:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabular{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hatch{background-image:repeating-linear-gradient(135deg,var(--hatch-line) 0 1px,transparent 1px 7px)}
.muted{color:var(--muted)} .fg{color:var(--fg)} .xs{font-size:12px} .sm{font-size:13px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}} @keyframes fade{from{opacity:0}} @keyframes slidein{from{transform:translateX(-100%)}} @keyframes slideinr{from{transform:translateX(100%)}}
/* Animasi muat data: skeleton mengikuti bentuk komponen, lalu tiap komponen masuk dengan animasinya sendiri */
:root{--sk:rgb(16 17 18 / .07);--shine:rgb(255 255 255 / .55);--ease-out:cubic-bezier(.16,1,.3,1)}
:root[data-theme="dark"]{--sk:rgb(255 255 255 / .07);--shine:rgb(255 255 255 / .06)}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes loadbar{0%{left:-35%;width:35%}60%{left:45%;width:45%}100%{left:100%;width:20%}}
.hdr{position:relative}
.hdr.fetching::after{content:"";position:absolute;bottom:-1px;height:2px;border-radius:99px;background:var(--accent);animation:loadbar 1s var(--ease-out) infinite}
main.loading{pointer-events:none}
main.loading :is(.stat,.card){position:relative;overflow:hidden}
main.loading :is(.stat,.card)::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,var(--shine) 50%,transparent 80%);animation:shimmer 1.15s ease-in-out infinite;pointer-events:none}
main.loading :is(.stat,.card) *{color:transparent!important;border-color:transparent!important;box-shadow:none!important;text-shadow:none!important;transition:none!important}
/* Placeholder input tidak ikut color:transparent turunan, jadi disembunyikan sendiri agar tidak menimpa blok skeleton */
main.loading :is(.stat,.card) ::placeholder{color:transparent!important;opacity:0!important}
main.loading :is(.stat,.card) .pills *{background:none!important} main.loading :is(.stat,.card) :is(.dotc,.capkey){background:var(--sk)!important}
main.loading :is(.stat,.card) svg:not(.lc svg):not(.donut svg){opacity:0}
main.loading :is(.stat,.card) :is(h2,small,b,p,a,span:not(:has(*)),dd,dt,.tag,.btn,.pills,.inp,.sel,.si,.av,.thumb,.cb){background:var(--sk)!important;border-radius:8px}
main.loading :is(.stat,.card) :is(td,th){background:linear-gradient(var(--sk),var(--sk)) left center/72% 12px no-repeat!important}
main.loading.loading :is(.stat,.card) :is(td,th) *{background:none!important}
/* Satu blok skeleton per komponen: elemen di dalam blok skeleton tidak boleh menggambar blok sendiri, supaya tidak saling menimpa */
main.loading.loading :is(.stat,.card) :is(h2,small,b,p,a,span:not(:has(*)),dd,dt,.tag,.btn,.pills,.inp,.sel,.si,.av,.thumb,.cb) *{background:none!important}
main.loading :is(.stat,.card) :is(.stat,.card)::after{display:none}
main.loading :is(.stat,.card) :is(.cc,.lc,.meter,.bar){background:var(--sk)!important;border-radius:14px}
main.loading :is(.stat,.card) :is(.cc,.lc,.meter,.bar)>*{visibility:hidden}
main.loading .donut svg{opacity:1} main.loading .donut circle{stroke:var(--sk)!important}
main.refetch :is(.tbl-wrap,.cc,.lc,.donut-wrap,.stats,.rows){opacity:.4;filter:saturate(.4);transition:opacity .2s,filter .2s;pointer-events:none}
/* Mikro-interaksi */
.stat,.card{transition:background-color .15s,transform .25s var(--ease-out),box-shadow .25s var(--ease-out)}
a.stat:hover,button.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-float)}
a.stat:active,button.stat:active{transform:translateY(0) scale(.99)}
.cc-col{transition:height .45s var(--ease-out),background-color .15s,transform .2s var(--ease-out)}
.cc-col:hover{transform:translateY(-3px)}
.bar i{transform-origin:left center}
.lc circle{transform-box:fill-box;transform-origin:center;transition:transform .2s var(--ease-out)}
.lc circle:hover{transform:scale(1.5)}
.tbl tbody td{transition:background-color .15s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Shell ===== */
.shell{display:flex;height:100dvh;background:var(--canvas)}
.skip{position:absolute;left:-999px;top:8px;z-index:100;background:var(--card);padding:8px 12px;border-radius:999px}
.skip:focus{left:8px}
.sidebar{position:relative;flex:none;width:256px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;transition:width .2s}
.sidebar.collapsed{width:72px}
.sb-handle{position:absolute;top:76px;right:-14px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-card);display:grid;place-items:center;color:var(--muted);z-index:5}
.sb-brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;flex:none}
.sb-brand img{height:26px;display:block}
:root[data-theme='dark'] .sb-brand img{background:#fff;border-radius:8px;padding:3px 6px;height:30px}
.sb-brand b{font-size:15px;color:var(--fg);font-weight:700;white-space:nowrap}
.sb-brand b i{font-style:normal;color:var(--accent)}
.sb-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 12px 12px;scrollbar-width:none;position:relative}
.sb-scroll::-webkit-scrollbar{display:none}
.ws{position:relative;margin-bottom:10px}
.ws-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:16px;border:1px solid var(--line);background:var(--raised);text-align:left}
.ws-tile{width:36px;height:36px;border-radius:12px;background:var(--accent-strong);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.ws-btn b{display:block;font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-btn small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-search{margin-bottom:14px}
.sb-sec{padding:12px 12px 6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--subtle)}
.sb-hr{border:0;border-top:1px solid var(--line);margin:10px 8px}
.nl{position:relative;display:flex;height:40px;align-items:center;gap:12px;border-radius:12px;padding:0 12px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.nl:hover{background:var(--raised);color:var(--fg)}
.nl.on{background:var(--accent-soft);color:var(--accent-text)}
.nl.on::before{content:"";position:absolute;top:8px;bottom:8px;left:-12px;width:4px;border-radius:0 99px 99px 0;background:var(--accent)}
.nl svg{flex:none}
.nl .cnt{margin-left:auto;height:20px;min-width:20px;border-radius:99px;background:var(--accent-strong);color:#fff;font-size:11px;font-weight:600;padding:0 6px;display:grid;place-items:center}
.collapsed .nl{justify-content:center;padding:0}
.collapsed .nl .lbl,.collapsed .sb-brand b,.collapsed .ws-btn span.wtx,.collapsed .ws-btn .chev,.collapsed .sb-search,.collapsed .promo,.collapsed .acct .atx,.collapsed .sw-row .lbl{display:none}
.collapsed .nl .cnt{position:absolute;top:7px;right:12px;height:8px;min-width:8px;padding:0;font-size:0}
.collapsed .ws-btn{justify-content:center;padding:6px}
.promo{margin-top:16px;border-radius:var(--r-panel);padding:14px;background:var(--pop-blue);color:#fff}
.promo b{display:block;font-size:14px;margin:8px 0 2px}
.promo p{font-size:12px;opacity:.85;line-height:1.4;margin-bottom:10px}
.sb-foot{flex:none;border-top:1px solid var(--line);padding:10px 12px 12px}
.sw-row{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;font-size:14px;font-weight:500;color:var(--muted)}
.collapsed .sw-row{justify-content:center;padding:0}
.acct{display:flex;align-items:center;gap:10px;padding:8px 6px 0}
.acct .atx{flex:1;min-width:0}
.acct b{display:block;font-size:13px;color:var(--fg)}
.acct small{display:block;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.collapsed .acct{flex-direction:column}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{display:flex;align-items:center;gap:12px;padding:24px 32px 16px}
.crumb ol{display:flex;gap:6px;list-style:none;font-size:12px;color:var(--muted)}
.crumb li+li::before{content:"/";margin-right:6px;color:var(--subtle)}
.crumb a:hover{color:var(--fg)}
h1.pt{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--fg);line-height:1.15;margin-top:2px}
h1.pt i,.dot-accent{font-style:normal;color:var(--accent)}
.hdr-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.datechip{height:40px;border-radius:99px;border:1px solid var(--line);background:var(--card);padding:0 16px;font-size:12px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-card);color:var(--fg)}
.btn.menu-btn{display:none}
main{flex:1;min-height:0;overflow-y:auto;padding:0 32px 40px;outline:none;position:relative}

/* ===== Components ===== */
.btn{display:inline-flex;flex:none;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:500;white-space:nowrap;transition:background-color .15s,opacity .15s,color .15s;user-select:none;height:40px;padding:0 16px;font-size:14px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.btn.icon{width:40px;padding:0} .btn.icon-sm{width:32px;height:32px;padding:0} .btn.icon-lg{width:48px;height:48px;padding:0}
.b-solid{background:var(--invert);color:var(--on-invert)} .b-solid:hover{opacity:.9}
.b-accent{background:var(--accent-strong);color:#fff;box-shadow:var(--shadow-glow)} .b-accent:hover{opacity:.92}
.b-soft{border:1px solid var(--line-strong);background:var(--raised);color:var(--fg)} .b-soft:hover{background:var(--control)}
.b-card{border:1px solid var(--line);background:var(--card);color:var(--fg);box-shadow:var(--shadow-card)} .b-card:hover{background:var(--raised)}
.b-ghost{color:var(--muted)} .b-ghost:hover{background:var(--control);color:var(--fg)}
.b-ink{background:var(--ink);color:#fff} .b-ink:hover{opacity:.85}
.b-onpop{background:#fff;color:var(--ink)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.row-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.tbl td.acts-c{width:1%;white-space:nowrap}
.tbl .b-danger.sm:hover{background:var(--danger);color:#fff}
.bell{position:relative}
.bell i{position:absolute;top:12px;right:13px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}

.grid{display:grid;gap:16px}
.g-ov{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2} .span3{grid-column:1/-1}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.card{border-radius:var(--r-card);border:1px solid var(--line);background:var(--card);padding:20px;box-shadow:var(--shadow-card);min-width:0}
.ch{margin-bottom:16px;display:flex;min-height:40px;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ch h2{font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--fg);display:flex;align-items:center;gap:8px}
.ch .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tile{border-radius:var(--r-panel);background:var(--raised);padding:16px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stat{border-radius:var(--r-card);border:1px solid var(--line);background:var(--card);padding:16px 18px;box-shadow:var(--shadow-card);text-align:left;display:flex;flex-direction:column;gap:6px;transition:background-color .15s}
.stat:hover{background:var(--raised)}
.stat.on{border-color:var(--fg);background:var(--raised)}
.stat .si{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin-bottom:4px}
.stat small{font-size:12px;color:var(--muted)}
.stat b{font-size:28px;font-weight:500;color:var(--fg);letter-spacing:-.02em;line-height:1.1}
.hero-n{font-size:44px;font-weight:500;letter-spacing:-.03em;color:var(--fg);line-height:1}

.pills{display:inline-flex;gap:2px;padding:4px;border-radius:99px;border:1px solid var(--line-strong);background:var(--raised)}
.pills button{height:32px;padding:0 14px;border-radius:99px;font-size:13px;color:var(--muted)}
.pills button:hover{color:var(--fg)}
.pills button.on{background:var(--invert);color:var(--on-invert);font-weight:500}
.utabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.utabs button{padding:0 0 8px;border-bottom:2px solid transparent;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.utabs button.on{border-color:var(--accent);color:var(--fg);font-weight:500}
.utabs .n{font-size:11px;background:var(--control);border-radius:99px;padding:1px 7px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-strong);background:var(--raised);font-size:12.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.fchip.on{background:var(--invert);border-color:var(--invert);color:var(--on-invert)}
.fchip .n{opacity:.7}

.dotc{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.spill{display:inline-flex;align-items:center;gap:6px;height:28px;border-radius:99px;border:1px solid var(--line-strong);background:var(--raised);padding:0 10px;font-size:12px;font-weight:500;color:var(--fg);white-space:nowrap}
.tag{display:inline-flex;align-items:center;height:20px;border-radius:6px;padding:0 6px;font-size:11px;font-weight:600;white-space:nowrap}
.t-neutral{background:var(--control);color:var(--muted)} .t-accent{background:var(--accent-soft);color:var(--accent-text)} .t-info{background:var(--info-soft);color:var(--info-text)}
.t-success{background:var(--success-soft);color:var(--success)} .t-warning{background:var(--warning-soft);color:var(--warning)} .t-danger{background:var(--danger-soft);color:var(--danger)}
.delta{display:inline-flex;align-items:center;gap:3px;height:24px;border-radius:99px;padding:0 8px;font-size:12px;font-weight:600}
.av{border-radius:50%;display:grid;place-items:center;font-weight:600;flex:none;font-size:12px;width:32px;height:32px}
.av.md{width:40px;height:40px;font-size:13px} .av.lg{width:48px;height:48px;font-size:15px}

.field{display:block}
.field[hidden]{display:none}
.field>span:not(.inp){display:block;font-size:12.5px;font-weight:500;color:var(--fg);margin-bottom:6px}
.inp{display:flex;align-items:center;gap:10px;height:44px;border-radius:99px;padding:0 16px;border:1px solid var(--line-strong);background:var(--raised)}
.inp:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.inp input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:14px;color:var(--fg)}
.inp.card{border-color:var(--line);background:var(--card);box-shadow:var(--shadow-card)}
.inp.h40{height:40px}
.inp svg{color:var(--muted);flex:none}
.sel{position:relative;display:inline-flex}
.sel select{appearance:none;height:40px;border-radius:99px;border:1px solid var(--line-strong);background:var(--raised);padding:0 36px 0 16px;font-size:13px;color:var(--fg);cursor:pointer}
.sel.sm select{height:32px;font-size:12px;padding:0 30px 0 12px}
.sel.card select{border-color:var(--line);background:var(--card);box-shadow:var(--shadow-card)}
.sel svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.sel.sm svg{right:9px}
.sel .dd-native{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.dd-btn{appearance:none;display:inline-flex;align-items:center;justify-content:space-between;gap:8px;height:40px;border-radius:99px;border:1px solid var(--line-strong);background:var(--raised);padding:0 14px 0 16px;font-size:13px;color:var(--fg);cursor:pointer;text-align:left;min-width:140px;max-width:100%}
.dd-btn .dd-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn svg{flex:none;color:var(--muted);position:static;transform:none;transition:transform .15s}
.dd-btn[aria-expanded=true] svg{transform:rotate(180deg)}
.dd-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dd-btn:disabled{opacity:.5;cursor:not-allowed}
.sel.sm .dd-btn{height:32px;font-size:12px;padding:0 10px 0 12px;min-width:110px}
.sel.card .dd-btn{border-color:var(--line);background:var(--card);box-shadow:var(--shadow-card)}
.bulk .sel .dd-btn{background:var(--card);color:var(--fg);border-color:transparent}
.sel:has(.dd-btn)>svg{display:none}
.dd-pop{position:fixed;z-index:200;max-width:calc(100vw - 16px);display:flex;flex-direction:column;border-radius:var(--r-panel);border:1px solid var(--line-strong);background:var(--card);padding:8px;box-shadow:var(--shadow-float);animation:rise .15s}
.dd-pop .inp{height:38px;margin-bottom:6px;flex:none}
.dd-list{overflow-y:auto;min-height:0}
.dd-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 12px;border-radius:12px;font-size:13px;color:var(--fg)}
.dd-opt:hover,.dd-opt.hi{background:var(--raised)}
.dd-opt[aria-selected=true]{font-weight:600;color:var(--accent-text)}
.dd-opt .dd-ck{margin-left:auto;flex:none}
.dd-opt[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.dd-empty{padding:16px 12px;text-align:center;font-size:12.5px;color:var(--muted)}
.dd-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 4px 0;margin-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex:none}
.dd-foot .pgn{display:flex;align-items:center;gap:6px}
.dd-foot button{width:28px;height:28px;border-radius:99px;border:1px solid var(--line-strong);background:var(--raised);display:inline-flex;align-items:center;justify-content:center;color:var(--fg)}
.dd-foot button:disabled{opacity:.4;cursor:not-allowed}
textarea.ta{width:100%;min-height:90px;border-radius:var(--r-panel);border:1px solid var(--line-strong);background:var(--raised);padding:12px 14px;resize:vertical;outline:none;color:var(--fg)}
textarea.ta:focus{outline:2px solid var(--accent);outline-offset:2px}
.switch{position:relative;width:48px;height:28px;border-radius:99px;background:var(--control);box-shadow:inset 0 0 0 1px var(--line-strong);flex:none;transition:background-color .15s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0 / .2);transition:transform .15s}
.switch[aria-checked=true]{background:var(--accent-strong);box-shadow:none}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.callout{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-panel);background:var(--info-soft);padding:12px 14px;font-size:13px;color:var(--body);line-height:1.5}
.callout svg{color:var(--info-text);flex:none;margin-top:1px}
.callout b{color:var(--fg)}
.callout.blue{background:var(--accent-soft)} .callout.blue svg{color:var(--accent-text)}

/* form */
.ferr{font-size:12px;color:var(--danger);font-weight:600;margin-top:6px}
.ferr:empty{display:none}
.panel-f .btn.b-danger{margin-right:auto}
.panel-b .tbl-wrap{margin:0}
#permtbl th,#permtbl td{padding:8px 6px}
#permtbl th{font-size:11px}

/* table */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);color:var(--body);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--raised)}
.tbl .r{text-align:right} .tbl .c{text-align:center}
.tbl td.strong{color:var(--fg);font-weight:600}
.cb{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line-strong);background:var(--card);display:grid;place-items:center;color:#fff;flex:none}
.cb.on{background:var(--accent-strong);border-color:var(--accent-strong)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pager .pg{display:flex;gap:6px;align-items:center}
.bulk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:var(--r-panel);background:var(--invert);color:var(--on-invert);padding:8px 8px 8px 16px;margin-bottom:12px;font-size:13px;animation:rise .2s}
.bulk .sel select{background:var(--card);color:var(--fg);border-color:transparent}

.bar{height:8px;border-radius:99px;background:var(--control);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.rowlink{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-panel);width:100%;text-align:left}
.rowlink:hover{background:var(--raised)}
.rows>*+*{border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kv>div{border-radius:var(--r-panel);background:var(--raised);padding:12px}
.kv dt{font-size:12px;color:var(--muted)} .kv dd{font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:2px}

.cc{display:flex;gap:10px}
.cc-axis{display:flex;flex-direction:column;justify-content:space-between;height:220px;font-size:11px;color:var(--subtle);text-align:right;width:40px;padding-bottom:0;flex:none}
.cc-main{flex:1;min-width:0}
.cc-plot{position:relative;height:220px;display:flex;align-items:flex-end;gap:10px}
.cc-grid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.cc-grid i{border-top:1px dashed var(--line)}

.cc-col{position:relative;width:100%;max-width:56px;border-radius:14px;border:1px solid var(--line-strong);background-color:var(--raised);transition:height .3s,background-color .15s;min-height:12px}
.cc-col:hover{background-color:var(--control)}
.cc-col.sel{background:var(--accent-grad);border-color:transparent;box-shadow:var(--shadow-glow)}
.cc-col .badge{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgb(255 255 255 / .9);color:var(--ink);font-size:11px;font-weight:600;border-radius:99px;padding:2px 7px;white-space:nowrap}
.cc-col .val{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.cc-cap{position:absolute;left:50%;transform:translateX(-50%);width:40%;max-width:24px;height:3px;border-radius:99px;background:var(--fg);opacity:.85;pointer-events:none}
.cc-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--invert);color:var(--on-invert);font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:3}
.cc-col:hover .cc-tip,.cc-col:focus-visible .cc-tip{opacity:1}
.cc-col.sel .cc-tip{display:none}
.cc-labels{display:flex;gap:10px;margin-top:8px}
.cc-labels span{flex:1;text-align:center;font-size:11.5px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-labels span.on{color:var(--fg);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.capkey{display:inline-block;width:14px;height:3px;border-radius:99px;background:var(--fg)}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{position:relative;width:196px;height:196px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut circle.seg{transition:stroke-width .15s,opacity .15s;cursor:pointer}
.donut.hi circle.seg{opacity:.45} .donut.hi circle.seg.on{opacity:1;stroke-width:30}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.donut .ctr b{font-size:24px;font-weight:500;color:var(--fg);letter-spacing:-.02em}
.donut .ctr small{font-size:12px;color:var(--muted);max-width:120px}
.dleg{flex:1;min-width:180px;display:flex;flex-direction:column;gap:2px}
.dleg button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;font-size:13px;text-align:left}
.dleg button:hover,.dleg button.on{background:var(--raised)}
.dleg .lb{flex:1;color:var(--body)} .dleg .v{font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.lc svg{width:100%;height:auto;display:block;overflow:visible}
.lc text{fill:var(--subtle);font-size:11px;font-family:var(--font)}

.gantt table{border-collapse:separate;border-spacing:3px;font-size:12px}
.gantt th{font-weight:500;color:var(--subtle);font-size:10.5px;min-width:18px}

.gantt td.c i{display:block;width:18px;height:22px;border-radius:6px}
.gantt td.c i.hatch{background-color:var(--raised)}
.meter{display:flex;justify-content:space-between;gap:2px;flex:1;height:22px;align-items:center}

/* overlays */
.overlay{position:fixed;inset:0;z-index:60;background:rgb(16 17 18 / .4);animation:fade .2s}
.panel{position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(480px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow-float);display:flex;flex-direction:column;animation:slideinr .25s cubic-bezier(.2,.8,.2,1)}
.panel-h{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 12px}
.panel-h h2{font-size:22px;font-weight:700;color:var(--fg);letter-spacing:-.02em;line-height:1.2}
.panel-b{flex:1;overflow-y:auto;padding:4px 20px 20px}
.panel-f{border-top:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.drawer{position:fixed;top:0;left:0;bottom:0;z-index:61;width:86%;max-width:320px;background:var(--card);animation:slidein .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}

.mi:hover{background:var(--raised);color:var(--fg)}
.toasts{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.toast b{display:block;font-weight:600}
.toast small{opacity:.75;display:block;margin-top:1px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:84px;height:84px;border-radius:14px;background:linear-gradient(135deg,#9FDDF5,#FFD2B3);display:grid;place-items:center;color:#fff}
.steps{position:relative}
.step{display:flex;gap:12px;position:relative;padding-bottom:16px}
.step:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:1px;background:var(--line-strong)}
.step .sd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px}
.sd.done{background:var(--success-soft);color:var(--success)} .sd.cur{background:var(--invert);color:var(--on-invert)} .sd.up{background:var(--raised);color:var(--subtle);box-shadow:inset 0 0 0 1px var(--line-strong)}
.step b{display:block;color:var(--fg);font-size:13.5px;font-weight:600} .step small{font-size:12px;color:var(--muted)}
.mapbox{height:150px;border-radius:var(--r-panel);overflow:hidden;background:#DDEBF6;position:relative}
:root[data-theme='dark'] .mapbox{background:#1A2633}

/* login */
.login{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr;background:var(--canvas)}
.login-art{background:var(--pop-blue);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-art h2{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.05;max-width:460px;position:relative}
.login-art p{opacity:.85;max-width:420px;margin-top:12px;font-size:15px;position:relative}
.login-form{display:flex;align-items:center;justify-content:center;padding:32px}
.login-form .card{width:100%;max-width:400px;padding:28px}

/* responsive */
@media (max-width:1279px){ .g-ov{grid-template-columns:repeat(2,minmax(0,1fr))} .g-ov .xl1{grid-column:span 2} .g-side{grid-template-columns:minmax(0,1fr)} }
@media (max-width:1023px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .g2{grid-template-columns:minmax(0,1fr)} }
@media (max-width:767px){
  .sidebar.main-sb{display:none}
  .btn.menu-btn{display:inline-flex}
  .hdr{padding:16px 16px 12px}
  h1.pt{font-size:24px}
  .datechip{display:none}
  main{padding:0 16px 32px}
  .g-ov{grid-template-columns:minmax(0,1fr)} .span2,.g-ov .xl1{grid-column:auto}
  .hero-n{font-size:36px}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tbl.resp thead{display:none}
  .tbl.resp,.tbl.resp tbody,.tbl.resp tr{display:block}
  .tbl.resp tr{border-bottom:1px solid var(--line);padding:10px 4px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
  .tbl.resp td{border:0;padding:2px 0;display:block}
  .tbl.resp td[data-l]:not(.prim)::before{content:attr(data-l) ": ";color:var(--subtle);font-size:11.5px}
  .tbl.resp td.prim{grid-column:1/-1;color:var(--fg);font-weight:600}
  .tbl.resp td.hide-m{display:none}
  .tbl.resp td.acts-c{grid-column:1/-1;width:auto;white-space:normal;text-align:left;padding-top:8px}
  .tbl.resp td.acts-c::before{display:none}
  .tbl.resp td.acts-c .row-acts{justify-content:flex-start;flex-wrap:wrap}
  .cc-plot,.cc-labels{gap:4px} .cc-axis{display:none} .cc-col .val{display:none}
  .toasts{left:16px;right:16px;align-items:stretch}
  .login{grid-template-columns:1fr} .login-art{display:none}
}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const jt=n=>{ if(Math.abs(n)>=1e9) return 'Rp'+(n/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M'; if(Math.abs(n)>=1e6) return 'Rp'+(n/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+' jt'; if(Math.abs(n)>=1e3) return 'Rp'+Math.round(n/1e3)+' rb'; return rp(n); };

const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const initials=n=>n.split(' ').map(s=>s[0]).join('').slice(0,2).toUpperCase();
const av=(name,cls='')=>`<span class="av ${cls}" role="img" aria-label="${esc(name)}" style="${POPS[hash(name)%5]}">${initials(name)}</span>`;
const tag=(t,tone='neutral')=>`<span class="tag t-${tone}">${t}</span>`;
const TONEC={neutral:'var(--subtle)',accent:'var(--accent)',info:'var(--info)',success:'var(--success)',warning:'var(--st-t)',danger:'var(--danger)'};
const spill=(t,tone='neutral')=>`<span class="spill"><i class="dotc" style="background:${TONEC[tone]}"></i>${t}</span>`;
const delta=(v,goodUp=true)=>{const good=goodUp?v>=0:v<0;return `<span class="delta ${good?'t-success':'t-danger'}" aria-label="${v>=0?'naik':'turun'} ${Math.abs(v)}%">${I(v>=0?'arrowup':'arrowdown',14,2.4)}${pct(Math.abs(v))}</span>`};
const btn=(label,{v='card',size='',icon=null,on='',attrs='',dis=false}={})=>`<button class="btn b-${v} ${size}" ${on?`onclick="${on}"`:''} ${attrs} ${dis?'disabled':''}>${icon?I(icon,size==='sm'?15:18):''}${label}</button>`;
const ibtn=(icon,label,on,{v='ghost',size='icon',attrs=''}={})=>`<button class="btn b-${v} ${size}" aria-label="${label}" title="${label}" onclick="${on}" ${attrs}>${I(icon,size==='icon-sm'?16:18)}</button>`;
const sel=(opts,val,on,{cls='',label='',id=''}={})=>`<label class="sel ${cls}"><span class="sr-only">${label}</span><select ${id?`id="${id}"`:''} onchange="${on}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`}).join('')}</select>${I('chev',16)}</label>`;
const pills=(items,active,fn)=>`<div class="pills" role="tablist">${items.map(([k,l])=>`<button role="tab" aria-selected="${k===active}" class="${k===active?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
const rowActs=(editOn,delOn,{del=true,edit=true}={})=>`${edit?btn('Edit',{v:'soft',size:'sm',icon:'edit',on:editOn}):''}${del?btn('Hapus',{v:'danger',size:'sm',icon:'trash',on:delOn}):''}`;
const utabs=(items,active,fn)=>`<div class="utabs" role="tablist">${items.map(([k,l,n])=>`<button role="tab" aria-selected="${k===active}" class="${k===active?'on':''}" onclick="${fn}('${k}')">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>`;
const card=(title,body,{acts='',cls='',icon=''}={})=>`<section class="card ${cls}">${title?`<div class="ch"><h2>${icon?I(icon,18):''}${title}</h2>${acts?`<div class="acts">${acts}</div>`:''}</div>`:''}${body}</section>`;
const callout=(html,cls='')=>`<div class="callout ${cls}">${I('bulb',18)}<span>${html}</span></div>`;
const swc=(on,fn,label)=>`<button class="switch" role="switch" aria-checked="${!!on}" aria-label="${label}" onclick="${fn}"></button>`;
function toast(title,desc='',tone='success'){
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<span style="color:${tone==='danger'?'var(--danger)':'inherit'}">${I(tone==='danger'?'alert':'check',18,2.2)}</span><div><b>${title}</b>${desc?`<small>${desc}</small>`:''}</div>`;
  const box=$('#toasts'); box.appendChild(el); while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>el.remove(),3600);
}

let lastPath=null;
/* ---------- Animasi muat data ----------
   Mockup tanpa backend, jadi "fetch" disimulasikan: pindah halaman memuat penuh (skeleton sesuai bentuk komponen),
   ganti filter atau query memuat ulang bagian data saja. Setelah data siap, tiap komponen masuk dengan animasinya sendiri.
   Render karena state lokal (pilih baris, hover, toggle) tidak dianggap fetch. */
const FX={key:null,mode:null,until:0,timer:0};
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeOut=t=>1-Math.pow(1-t,3);
function fxBegin(mode){ const ms=mode==='full'?480+Math.random()*260:260+Math.random()*140; FX.mode=mode; FX.until=Date.now()+ms; clearTimeout(FX.timer); FX.timer=setTimeout(fxReveal,ms); fxApply(); }
function fxApply(){ const m=$('main'), h=$('.hdr'); if(!m) return; const on=FX.mode&&Date.now()<FX.until; m.classList.toggle('loading',on&&FX.mode==='full'); m.classList.toggle('refetch',on&&FX.mode==='soft'); h?.classList.toggle('fetching',!!on); if(on) m.setAttribute('aria-busy','true'); else m.removeAttribute('aria-busy'); }
function fxReveal(){ const mode=FX.mode; FX.mode=null; fxApply(); const m=$('main'); if(!m||!mode) return; fxAnimate(m,mode==='full'); }
function fxAnimate(root,full){
  const A=(el,kf,o)=>el.animate(kf,{fill:'backwards',easing:'cubic-bezier(.16,1,.3,1)',...o});
  if(full) [...root.querySelectorAll(':scope > :not(.grid):not(.stats), :scope > .stats > *, :scope > .grid > *, :scope > div > .card')].forEach((el,i)=>A(el,[{opacity:0,transform:'translateY(14px) scale(.985)'},{opacity:1,transform:'none'}],{duration:520,delay:Math.min(i,10)*55}));
  // Angka: hitung naik dari 0 ke nilai akhir, format Indonesia tetap
  root.querySelectorAll('.stat b, .hero-n, .donut .ctr b').forEach((el,i)=>countUp(el,700+i*40));
  // Grafik kolom: batang tumbuh dari bawah, bergantian
  root.querySelectorAll('.cc').forEach(cc=>cc.querySelectorAll('.cc-col').forEach((c,i)=>A(c,[{transform:'scaleY(0)',transformOrigin:'bottom',opacity:.3},{transform:'scaleY(1)',transformOrigin:'bottom',opacity:1}],{duration:650,delay:120+i*45})));
  root.querySelectorAll('.cc-cap').forEach((c,i)=>A(c,[{opacity:0},{opacity:.85}],{duration:300,delay:500+i*45}));
  // Grafik garis: garis tergambar, area muncul, titik meletup
  root.querySelectorAll('.lc svg').forEach(svg=>{
    svg.querySelectorAll('path[fill="none"]').forEach((p,i)=>{ const L=p.getTotalLength(); A(p,[{strokeDasharray:L,strokeDashoffset:L},{strokeDasharray:L,strokeDashoffset:0}],{duration:900,delay:150+i*120,easing:'cubic-bezier(.65,0,.35,1)'}); });
    svg.querySelectorAll('path:not([fill="none"])').forEach(p=>A(p,[{opacity:0},{opacity:.1}],{duration:700,delay:500}));
    svg.querySelectorAll('circle').forEach((c,i)=>A(c,[{transform:'scale(0)'},{transform:'scale(1)'}],{duration:380,delay:350+i*25,easing:'cubic-bezier(.34,1.56,.64,1)'}));
  });
  // Donut: segmen menyapu searah jarum jam
  root.querySelectorAll('.donut').forEach(d=>{ d.querySelectorAll('circle.seg').forEach((c,i)=>{ const [len,rest]=c.getAttribute('stroke-dasharray').split(' ').map(Number); A(c,[{strokeDasharray:`0 ${len+rest}`},{strokeDasharray:`${len} ${rest}`}],{duration:700,delay:150+i*110}); }); });
  root.querySelectorAll('.dleg button').forEach((b,i)=>A(b,[{opacity:0,transform:'translateX(-6px)'},{opacity:1,transform:'none'}],{duration:360,delay:300+i*50}));
  // Tabel dan daftar: baris berurutan
  root.querySelectorAll('.tbl tbody, .rows').forEach(tb=>[...tb.children].slice(0,14).forEach((r,i)=>A(r,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:380,delay:140+i*35})));
  // Progress dan meter
  root.querySelectorAll('.bar i').forEach((b,i)=>A(b,[{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:800,delay:200+Math.min(i,12)*40}));
  root.querySelectorAll('.meter').forEach(m=>[...m.children].forEach((c,i)=>A(c,[{opacity:0,transform:'scaleY(.2)'},{opacity:1,transform:'none'}],{duration:300,delay:150+i*14})));
}
function countUp(el,dur){
  const txt=el.textContent, m=txt.match(/\d{1,3}(?:\.\d{3})+(?:,\d+)?|\d+(?:,\d+)?/);
  if(!m||txt.includes(':')||/^0\d/.test(m[0])) return;
  const dec=(m[0].split(',')[1]||'').length, end=parseFloat(m[0].replace(/\./g,'').replace(',','.')); if(!end) return;
  const fmt=v=>v.toLocaleString('id-ID',{minimumFractionDigits:dec,maximumFractionDigits:dec}), pre=txt.slice(0,m.index), post=txt.slice(m.index+m[0].length);
  const t0=performance.now(); el.textContent=pre+fmt(0)+post;
  const step=now=>{ if(!el.isConnected) return; const k=Math.min(1,(now-t0)/dur); el.textContent=pre+fmt(k<1?Math.round(end*easeOut(k)*10**dec)/10**dec:end)+post; if(k<1) requestAnimationFrame(step); else { const dn=el.closest('.donut'); if(dn){ delete dn.dataset.t; delete dn.dataset.c; } } };
  requestAnimationFrame(step);
  // Tab di latar belakang menahan requestAnimationFrame; pastikan nilai akhir tetap tampil.
  setTimeout(()=>{ if(el.isConnected&&el.textContent!==txt) el.textContent=txt; },dur+150);
}

  const loc=locate(path);

  app.innerHTML=`<div class="shell"><a class="skip" href="#main" onclick="event.preventDefault();$('main').focus()">Lewati ke konten</a>

      <h1 class="pt">${page.title}<i>.</i></h1></div>
      <div class="hdr-r"><span class="datechip">${I('cal',16)}Senin, 26 Okt 2026</span><span style="position:relative">${`<button class="btn b-card icon-lg bell" aria-label="Notifikasi" onclick="bellPop(this)">${I('bell',20)}<i></i></button>`}</span></div>
    </header>
    <main id="main" tabindex="-1">${page.html}</main></div></div>`;
  $('main').scrollTop=lastPath===path?keep:0;
  const key=location.hash.split('?')[1]||'';
  if(!reduceMotion()){ if(lastPath!==path) fxBegin('full'); else if(FX.key!==key) fxBegin('soft'); else fxApply(); }
  FX.key=key; lastPath=path;
  page.after?.();
}

  const r=repRange(q), clients=live('client').filter(c=>clientHasModul(c,'Sales automation')&&c.status==='Aktif');

function saveForm(mode){
  const {ent,id,prefill}=FORM, E=ENT[ent]; const vals={}, errs={}; const cur0=id?E.store().find(x=>x.id===id):null, base=cur0||{...(E.blank?E.blank():{}),...(prefill||{})};

    if(fd.type==='multi') v=[...el.querySelectorAll('.fchip.on')].map(b=>b.dataset.v);

  });
  const ex=E.readExtra?E.readExtra():{}; const exErr=E.validateExtra?E.validateExtra({...vals,...ex}):''; if(exErr) errs.__extra=exErr;
  if(E.unique&&vals[E.unique]&&E.store().some(x=>!x.del&&x.id!==id&&String(x[E.unique]).toLowerCase()===String(vals[E.unique]).toLowerCase())) errs[E.unique]=(E.unique==='code'?'Kode':'Nama')+' sudah dipakai';

  Object.assign(vals,ex);

  if(id){ rec=E.store().find(x=>x.id===id); if(E.onRename&&rec.name!==vals.name) E.onRename(rec.name,vals.name); Object.assign(rec,vals); audit(`Mengubah ${lc(E)} ${E.title(rec)}`); }

  if(mode==='publish'){ rec.status='Terbit'; E.onPublish?.(rec); audit(`Menerbitkan ${lc(E)} ${E.title(rec)}`); }
  const tl=E.toastLabel?E.toastLabel(rec):E.label;
  closeLayer(); render(false); toast(`${tl} ${mode==='publish'?'diterbitkan':id?'diperbarui':'ditambahkan'}`,E.title(rec));
}

function qRow(q,i,kind){

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><b class="fg sm qn" style="width:22px">${i+1}.</b>
      <span class="sel sm" style="display:flex;flex:1"><select class="qt" onchange="qType(this)" style="width:100%" aria-label="Jenis pertanyaan ${i+1}">${QTYPES[kind].map(([k,l])=>`<option value="${k}" ${q.type===k?'selected':''}>${l}</option>`).join('')}</select>${I('chev',14)}</span>
      ${ibtn('trash','Hapus pertanyaan','qDel(this)',{v:'ghost',size:'icon-sm'})}</div>
    <span class="inp h40" style="margin-bottom:6px"><input class="qq" value="${esc(q.q||'')}" placeholder="Tulis pertanyaan" aria-label="Pertanyaan ${i+1}"></span>
    ${opts.length?opts.map((o,j)=>`<div style="display:flex;gap:8px;align-items:center;margin-top:6px">${keyed?`<button type="button" class="cb qk ${q.key===j?'on':''}" onclick="qKey(this)" aria-pressed="${q.key===j}" aria-label="Jadikan kunci jawaban">${q.key===j?I('check',12,3):''}</button>`:`<span class="xs muted" style="width:18px;text-align:center">${'ABCD'[j]}</span>`}<span class="inp h40" style="flex:1;height:36px"><input class="qo" value="${esc(o)}" placeholder="Opsi ${'ABCD'[j]}" ${q.type==='bs'&&keyed?'readonly':''}></span></div>`).join('')+(keyed?'<p class="xs muted" style="margin-top:6px">Centang kunci jawaban. Skor dihitung otomatis (BRD 6.1.9–6.1.10).</p>':'')
      :`<p class="xs muted">${q.type==='skala'?'Responden memilih 1 (sangat kurang) sampai 5 (sangat baik).':q.type==='singkat'?'Responden menjawab dengan teks singkat.':'Responden menjawab dengan teks panjang.'}</p>`}
  </div>`;
}
function qRead(row){ return {q:row.querySelector('.qq').value.trim(),type:row.querySelector('.qt').value,opts:[...row.querySelectorAll('.qo')].map(i=>i.value.trim()),key:[...row.querySelectorAll('.qk')].findIndex(b=>b.classList.contains('on'))}; }
function qRenum(){ document.querySelectorAll('#qb .qrow').forEach((r,i)=>r.querySelector('.qn').textContent=(i+1)+'.'); }
function qAdd(){ const kind=kontenKind(), n=document.querySelectorAll('#qb .qrow').length; document.getElementById('qb').insertAdjacentHTML('beforeend',qRow({q:'',type:QTYPES[kind][0][0],key:-1},n,kind)); document.querySelectorAll('#qb .qq')[n].focus(); }
function qType(sel){ const row=sel.closest('.qrow'), d=qRead(row), i=[...row.parentElement.children].indexOf(row); d.type=sel.value; if(d.type==='pg'&&d.opts.length!==4) d.opts=['','','','']; d.key=-1; row.outerHTML=qRow(d,i,kontenKind()); }
function qDel(b){ b.closest('.qrow').remove(); qRenum(); }
function qKey(b){ b.closest('.qrow').querySelectorAll('.qk').forEach(x=>{ const on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-pressed',on); x.innerHTML=on?I('check',12,3):''; }); }
function kontenType(sel){
  const kind=sel.value; document.querySelectorAll('[data-only]').forEach(el=>el.style.display=el.dataset.only===kind?'':'none');
  const rows=[...document.querySelectorAll('#qb .qrow')].map(qRead).map(d=>({...d,type:QTYPES[kind].some(t=>t[0]===d.type)?d.type:QTYPES[kind][0][0],key:-1}));
  document.getElementById('qb').innerHTML=rows.map((d,i)=>qRow(d,i,kind)).join('');
}

/* ---------- Hasil kerja sales ---------- */
/* Usulan: tab ini tidak ada di BRD/URD. Ia mengumpulkan input mobile per sales supaya admin tidak membuka sembilan laporan satu per satu.
   Pekerjaan = tugas wajib per peran: tugas kunjungan FMCG/MD (BR-043), SKU display harian (BR-102), market share, stok bawaan dan tanda terima canvasing (FR-STOCK-006), kunjungan terjadwal, dan lead yang di-assign.
   Data aktivitas di mockup baru ada sejak 25 Okt (SKU display, tugas FMCG), stok bawaan, market share, dan kunjungan sejak 26 Okt. */
const HK_TODAY='2026-10-26', HK_FM_FROM='2026-10-25';
const HK_ROLES=[['','Semua peran'],['spg','SPG / Promotor'],['canvas','Canvasing'],['order','Taking Order'],['fmcg','Promotor FMCG & MD'],['leads','REA & CBD']];
const HK_RETUR=[{u:'budi',toko:'Toko Makmur Abadi',p:'rc18',q:2,kondisi:'Layak jual'},{u:'budi',toko:'Toko Berkah Elektronik',p:'kp16',q:1,kondisi:'Tidak layak jual'},{u:'kevin',toko:'Toko Jaya Abadi Kembangan',p:'bl11',q:3,kondisi:'Layak jual'}];
const HK_ST={done:['Selesai','success'],draft:['Berjalan','warning'],todo:['Belum','neutral']};
const hkUsers=()=>[...SALES,...FMCG_USERS,...LEADS_USERS];
const hkKind=u=>{ const j=byU(u).job; return j==='Canvasing'?'canvas':j==='Taking Order'?'order':isFm(u)?'fmcg':LEADS_USERS.some(x=>x.u===u)?'leads':'spg'; };
const hkVal=t=>t.inv?t.inv.price:t.total;
const hkQ=q=>(q.per||q.from||q.to)?q:{...q,per:'d'};
const hkRange=q=>repRange(hkQ(q));
const hkLabel=q=>repLabel(hkQ(q));
const labIso=l=>{ const [d,mn]=String(l).trim().split(' '); const m=+Object.keys(LD_MN).find(k=>LD_MN[k]===mn); return m?isoOf(m,+d):''; };
const hkIn=(iso,r)=>!!iso&&iso>=r.from&&iso<=r.to;
const hkDays=r=>{ const o=[]; for(const t=new Date(r.from+'T00:00:00');t<=new Date(r.to+'T00:00:00');t.setDate(t.getDate()+1)) o.push(isoOf(t.getMonth()+1,t.getDate())); return o; };
function hkScope(u){
  const me=byU(u), usr=live('user').find(x=>x.id===u);
  let tks=tokoOfU(u); if(!tks.length&&me.toko) tks=TOKO.filter(t=>t.name===me.toko&&!t.del);
  return {cl:(usr&&usr.clients)||['cl1'],cb:[...new Set([me.cabang,...tks.map(t=>t.cabang)])],tk:tks.map(t=>t.id),tkName:tks.length>1?tks.length+' toko · '+tks[0].name:(tks[0]?tks[0].name:me.toko||'–')};
}
function hkData(u,r){
  const me=byU(u), k=hkKind(u), today=hkIn(HK_TODAY,r), sc=hkScope(u);
  const x={u,k,me,r,sc,today,multi:r.from!==r.to,
    trx:allTrx().filter(t=>t.u===u&&hkIn(trxIso(t),r)),
    sku:SKU_REP.filter(s=>s.u===u&&hkIn(labIso(s.tgl),r)),
    share:today?SHARE_REP.flatMap(s=>s.inp.filter(i=>i[0]===u).map(i=>({toko:s.toko,cat:s.cat,brand:s.brand,qty:i[1],st:i[2]}))):[],
    fm:fmLogRows().filter(a=>a.who===me.name&&hkIn(labIso(a.tgl),r)),
    orders:MD.order.filter(o=>!o.del&&o.u===u&&hkIn(isoOf(o.m,o.day),r)),
    leads:D.leads.filter(l=>l.owner===u&&hkIn(labIso(l.date),r)),
    retur:today?HK_RETUR.filter(a=>a.u===u):[],
    cv:today?CV_REP.find(a=>a.u===u):null,
    usulan:D.usulan.filter(s=>s.by===u&&hkIn(labIso(String(s.when).split(',')[0]),r)),
    visits:today?D.visits.filter(v=>!v.del&&v.u===u):[],
    abs:today?TODAY.find(a=>a.u===u):null};
  const cuti=today&&x.abs&&x.abs.st==='Cuti', T=[], add=(date,name,st)=>T.push({date,name,st});
  const fmSt=s=>s==='Selesai'?'done':s==='Draft'?'draft':'todo';
  if(k==='leads') x.leads.forEach(l=>add(labIso(l.date),'Lead '+l.name,l.status==='Deal'||l.status==='Belum Tertarik'?'done':l.status==='Prospect'?'draft':'todo'));
  else hkDays(r).forEach(iso=>{
    if(cuti&&iso===HK_TODAY) return;
    if(k==='fmcg'&&iso>=HK_FM_FROM) ['Cek stok','Price promo','Facing display','Market share'].forEach(j=>{ const a=x.fm.find(z=>z.jenis===j&&labIso(z.tgl)===iso); add(iso,j,a?fmSt(a.status):'todo'); });
    if(k==='spg'&&iso>=HK_FM_FROM) add(iso,'SKU display',x.sku.some(s=>labIso(s.tgl)===iso)?'done':'todo');
    if(k==='spg'&&iso===HK_TODAY) add(iso,'Market share',x.share.some(s=>s.st!=='Draft')?'done':x.share.length?'draft':'todo');
    if(k==='canvas'&&iso===HK_TODAY){ add(iso,'Stok bawaan',x.cv?'done':'todo'); add(iso,'Tanda terima',x.cv&&x.cv.tt==='Ada'?'done':'todo'); }
    if((k==='spg'||k==='canvas'||k==='order')&&iso===HK_TODAY) x.visits.forEach(v=>add(iso,'Kunjungan '+v.place,v.status==='Selesai'?'done':v.status==='Berjalan'?'draft':'todo'));
  });
  x.tasks=T; x.total=T.length; x.done=T.filter(t=>t.st==='done').length; x.todo=x.total-x.done; x.draft=T.filter(t=>t.st==='draft').length;
  const fl=[], rusak=x.sku.filter(a=>a.cond==='Rusak').length, tl=x.retur.filter(a=>a.kondisi!=='Layak jual').length,
    dr=x.fm.filter(a=>a.status==='Draft').length+x.share.filter(i=>i.st==='Draft').length,
    mu=x.usulan.filter(s=>s.status==='Menunggu verifikasi').length, sl=x.trx.filter(t=>t.inv&&t.inv.flag).length;
  if(cuti) fl.push(['Cuti','info']);
  if(rusak) fl.push([rusak+' SKU rusak','danger']);
  if(tl) fl.push([tl+' retur tidak layak','warning']);
  if(x.cv&&x.cv.tt==='Belum') fl.push(['Tanda terima belum ada','warning']);
  if(dr) fl.push([dr+' draft','warning']);
  if(mu) fl.push(['Usulan toko menunggu','info']);
  if(sl) fl.push([sl+' selisih invoice','warning']);
  x.flags=fl;
  x.n=x.trx.length+x.sku.length+x.share.length+x.fm.length+x.orders.length+x.retur.length+x.usulan.length+(x.cv?1:0)+x.leads.length;
  return x;
}
function hkPer(k){ setQ({per:k,from:'',to:''}); }
function hkDate(){ const f=document.getElementById('hk_from').value, t=document.getElementById('hk_to').value;
  if(f&&t&&f>t){ toast('Rentang tidak valid','Tanggal mulai harus sebelum atau sama dengan tanggal akhir.','danger'); return; }
  setQ({from:f,to:t,per:''}); }

  const rows=all.filter(x=>f==='lapor'?x.n>0:f==='flag'?x.flags.length>0:f==='belum'?x.todo>0:true);
  const lapor=all.filter(x=>x.n>0).length, T=all.reduce((a,x)=>a+x.total,0), D_=all.reduce((a,x)=>a+x.done,0), nflag=all.filter(x=>x.flags.length).length, nbelum=all.filter(x=>x.todo>0).length;

      ${sel([['','Semua cabang'],...CABANG.slice(1)],q.cb||'',"setQ({cb:this.value,tk:''})",{label:'Filter cabang',cls:'sm'})}
      ${sel([['','Semua toko'],...tokoOpts.map(t=>[t.id,t.name])],q.tk||'',"setQ({tk:this.value})",{label:'Filter toko',cls:'sm'})}
      <form style="flex:1;min-width:180px" onsubmit="event.preventDefault();setQ({q:this.q.value})"><label class="inp h40"><span class="sr-only">Cari sales</span>${I('search',16)}<input name="q" value="${esc(q.q||'')}" placeholder="Cari nama sales"></label></form>
      ${dirty?btn('Hapus filter',{v:'ghost',size:'sm',on:"setQ({cl:'',cb:'',tk:'',r:'',q:'',f:'',from:'',to:'',per:''})"}):''}</div>
    <p class="xs muted" style="margin-top:12px">Menampilkan <b class="fg">${hkLabel(q)}</b>: ${all.length} sales, ${T} pekerjaan (${D_} selesai). Data aktivitas di mockup baru ada sejak 25 Okt 2026 (SKU display, tugas FMCG dan MD), stok bawaan, market share, dan kunjungan sejak 26 Okt. <b>Usulan</b>: tab ini belum ada di BRD atau URD.</p>`);
  return {html:`
  <div style="margin-bottom:16px">${filt}</div>
  <div class="stats">
    ${stat('Sales melapor',lapor+' dari '+all.length,f==='lapor'?'Filter aktif · klik untuk hapus':'Klik untuk lihat yang sudah input',`setQ({f:'${f==='lapor'?'':'lapor'}'})`,f==='lapor')}
    ${stat('Total pekerjaan',T,(T-D_)+' belum selesai · '+D_+' selesai',`setQ({f:'${f==='belum'?'':'belum'}'})`,f==='belum')}
    ${stat('Pekerjaan selesai',T?Math.round(D_/T*100)+'%':'–',D_+' dari '+T+' · buka log aktivitas',"setQ({tab:'log'})")}
    ${stat('Perlu tindak lanjut',nflag+' sales',f==='flag'?'Filter aktif · klik untuk hapus':'SKU rusak, retur, draft, usulan',`setQ({f:'${f==='flag'?'':'flag'}'})`,f==='flag')}
  </div>
  ${card('Hasil kerja per sales',dataTable('hk',{rows,rowClick:x=>`hkPanel('${x.u}')`,empty:'Tidak ada sales dengan filter ini.',cols:[

      {label:'Pencapaian',render:x=>x.total?achBar(x.done,x.total):'<span class="muted">–</span>',hide:true},

}
const hkSec=(title,n,link,body)=>`<div style="margin-top:18px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap"><b class="fg sm" style="flex:1;min-width:120px">${title}</b>${tag(n,'neutral')}<a href="#${link[0]}" onclick="closeLayer()" class="xs" style="color:var(--accent-text);font-weight:600">${link[1]}</a></div>${n?body:`<div class="tile xs muted">Belum ada data pada rentang ini.</div>`}</div>`;
const hkTbl=(cols,rows)=>`<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="${c[2]||''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${c[2]||''}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  } else if(k==='order'){

  } else if(k==='fmcg'){
    ['Cek stok','Price promo','Facing display','Market share','Support task'].forEach(j=>{ s+=hkFm(x,j); });

    s+=hkSec('Hasil leads',x.leads.length,['/leads','Leads pinjaman'],hkTbl([['Nasabah',l=>esc(l.name)],['Produk',l=>esc(l.prod)],['Pengajuan',l=>`<span class="tabular">${jt(l.amount)}</span>`,'r'],['Status',l=>tag(l.status,l.status==='Deal'?'success':l.status==='Prospect'?'accent':l.status==='Baru'?'info':'neutral')],['Goal',l=>l.goal?`<b class="fg tabular">${jt(l.goal)}</b>`:'<span class="muted">–</span>','r']],x.leads));
  }
  if(k==='canvas'||k==='order') s+=hkSec('Usulan toko baru',x.usulan.length,['/toko?tab=usulan','Verifikasi usulan'],hkTbl([...hkDc(x,a=>esc(String(a.when).split(',')[0])),['Toko',a=>esc(a.name)],['Pemilik',a=>esc(a.owner)],['Kategori',a=>esc(a.cat)],['Status',a=>tag(a.status,a.status==='Menunggu verifikasi'?'info':'neutral')]],x.usulan));
  openPanel(esc(x.me.name),kv+fl+s,btn('Tutup',{v:'card',on:'closeLayer()'})+btn('Unduh rekap',{v:'soft',icon:'down',on:`toast('Rekap ${esc(x.me.name.split(' ')[0])} diunduh','${esc(hkLabel(q))}.')`}),{sub:esc(x.me.job)+' · '+esc(hkLabel(q))});
}

const ROUTES={'/':pageOverview,'/penjualan':pagePenjualan,'/absensi':pageAbsensi,'/kunjungan':pageKunjungan,'/approval':pageApproval,'/target':pageTarget,'/promo':pagePromo,'/insentif':pageInsentif,'/grading':pageGrading,'/leads':pageLeads,'/overdue':pageOverdue,'/company-sim':pageSimco,'/sektor':pageSektor,'/client':pageClient,'/kategori-toko':pageKategori,'/toko':pageToko,'/iam':pageIAM,'/produk':pageProduk,'/penugasan':pagePenugasan,'/pemesanan':pagePemesanan,'/sell-in':pageSellin,'/user-sales':pagePengguna,'/user-admin':pageAdmin,'/parameter':pageParameter,'/task-pending':pageTaskPending,'/aktivitas':pageAktivitas,'/canvassing':pageCanvassing,'/posm':pagePosm,'/region':pageRegion,'/brand':pageBrand,'/kategori-produk':pageKatProd,'/kompetitor':pageKompetitor,'/cabang-client':pageCabang,'/mapping-outlet':pageMapOutlet,'/data-penjualan':pageDataJual,'/penagihan':pagePenagihan,'/klaim-biaya':pageKlaim,'/live-tracking':pageTracking,'/kepatuhan-kunjungan':pageKepatuhan,'/pengumuman':pagePengumuman,'/sinkron':pageSinkron,'/satuan':pageSatuan,'/konversi':pageKonversi,'/konfigurasi-aktivitas':pageAktCfg,'/form-penjualan':pageFormJual,'/status-produk':pageStatProd,'/event':pageEvent,'/mitra':pageMitra,'/sku-display':pageSkuDisplay,'/market-share':pageMarketShare,'/quiz':q=>pageKonten(q,'Quiz'),'/survey':q=>pageKonten(q,'Survey'),'/pengaturan':pagePengaturan};
/* ---------- Dropdown dengan pencarian dan pagination ----------
   Semua <select> otomatis diganti tombol + panel. Select asli tetap ada (tersembunyi), jadi value, onchange, dan id tetap bekerja. */
(function(){
  const PS=8; let cur=null;
  const vd=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  Object.defineProperty(HTMLSelectElement.prototype,'value',{configurable:true,get(){return vd.get.call(this)},set(v){ vd.set.call(this,v); if(this._ddPaint) this._ddPaint(); }});
  const label=sel=>{ const l=sel.closest('label'); const sp=l&&l.querySelector('span'); return (sel.getAttribute('aria-label')||(sp&&!sp.querySelector('select,.sel')?sp.textContent:'')||'').replace(/\s*\*\s*$/,'').trim(); };
  function paint(sel){ const b=sel._ddBtn; if(!b) return; const o=sel.options[sel.selectedIndex], t=o?o.text:''; b.querySelector('.dd-t').textContent=t||'Pilih'; const n=label(sel); b.setAttribute('aria-label',(n?n+': ':'')+(t||'Pilih')); b.disabled=sel.disabled; }
  function enhance(sel){ if(sel._dd||sel.hasAttribute('multiple')||sel.size>1) return; sel._dd=1;
    const b=document.createElement('button'); b.type='button'; b.className='dd-btn'; b.setAttribute('aria-haspopup','listbox'); b.setAttribute('aria-expanded','false'); b.innerHTML='<span class="dd-t"></span>'+I('chev',16);
    if(sel.style.width) b.style.width=sel.style.width;
    sel.parentNode.insertBefore(b,sel); sel._ddBtn=b; sel._ddPaint=()=>paint(sel);
    sel.classList.add('dd-native'); sel.tabIndex=-1; sel.setAttribute('aria-hidden','true');
    b.addEventListener('click',e=>{ e.preventDefault(); cur&&cur.sel===sel?close(true):openDD(sel); });
    b.addEventListener('keydown',e=>{ if(['ArrowDown','ArrowUp'].includes(e.key)){ e.preventDefault(); openDD(sel); } });
    sel.addEventListener('change',()=>paint(sel));
    new MutationObserver(()=>paint(sel)).observe(sel,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','selected']});
    paint(sel); }
  function enhanceAll(root){ (root||document).querySelectorAll('select:not(.dd-native)').forEach(enhance); }
  let q=0; new MutationObserver(()=>{ if(q) return; q=setTimeout(()=>{ q=0; enhanceAll(); },0); }).observe(document.body,{childList:true,subtree:true});
  function close(refocus){ if(!cur) return; const {sel,pop,btn}=cur; pop.remove(); btn.setAttribute('aria-expanded','false'); cur=null; removeEventListener('resize',place); removeEventListener('scroll',onScroll,true); if(refocus) btn.focus({preventScroll:true}); }
  function onScroll(e){ if(cur&&!cur.pop.contains(e.target)) place(); }
  function place(){ if(!cur) return; const {btn,pop}=cur, r=btn.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight){ close(false); return; }
    const w=Math.max(r.width,260), left=Math.max(8,Math.min(r.left,innerWidth-Math.min(w,innerWidth-16)-8)); pop.style.width=Math.min(w,innerWidth-16)+'px'; pop.style.left=left+'px';
    const list=pop.querySelector('.dd-list'); list.style.maxHeight=''; const h=pop.offsetHeight, below=innerHeight-r.bottom-14, above=r.top-14;
    if(h>below&&above>below){ list.style.maxHeight=Math.max(120,above-(h-list.offsetHeight))+'px'; pop.style.top=Math.max(8,r.top-6-pop.offsetHeight)+'px'; }
    else { list.style.maxHeight=Math.max(120,below-(h-list.offsetHeight))+'px'; pop.style.top=(r.bottom+6)+'px'; } }
  function openDD(sel){ close(false); const btn=sel._ddBtn, pop=document.createElement('div'); pop.className='dd-pop';
    pop.innerHTML=`<label class="inp card">${I('search',16)}<input type="text" role="combobox" aria-expanded="true" aria-label="Cari opsi" placeholder="Cari…" autocomplete="off"></label><div class="dd-list" role="listbox"></div><div class="dd-foot" hidden></div>`;
    document.body.appendChild(pop); btn.setAttribute('aria-expanded','true');
    const st={sel,btn,pop,q:'',page:0,hi:0,items:[]}; cur=st;
    const inp=pop.querySelector('input'), list=pop.querySelector('.dd-list'), foot=pop.querySelector('.dd-foot');
    const all=()=>[...sel.options].map((o,i)=>({i,t:o.text,dis:o.disabled}));
    const sIdx=sel.selectedIndex;
    function draw(){ const k=st.q.trim().toLowerCase(); st.items=all().filter(x=>!k||x.t.toLowerCase().includes(k)); const pages=Math.max(1,Math.ceil(st.items.length/PS)); st.page=Math.min(Math.max(st.page,0),pages-1);
      const view=st.items.slice(st.page*PS,st.page*PS+PS); st.hi=Math.min(Math.max(st.hi,st.page*PS),st.page*PS+Math.max(0,view.length-1));
      list.innerHTML=view.length?view.map((x,j)=>{ const g=st.page*PS+j, on=x.i===sel.selectedIndex; return `<button type="button" role="option" class="dd-opt ${g===st.hi?'hi':''}" aria-selected="${on}" ${x.dis?'aria-disabled="true"':''} data-g="${g}"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(x.t||'—')}</span>${on?`<span class="dd-ck">${I('check',14,2.5)}</span>`:''}</button>`; }).join(''):'<div class="dd-empty">Tidak ada hasil</div>';
      foot.hidden=st.items.length<=PS; foot.innerHTML=`<span>${st.items.length?`${st.page*PS+1}–${Math.min(st.items.length,st.page*PS+PS)} dari ${st.items.length}`:'0 data'}</span><span class="pgn"><button type="button" data-p="-1" aria-label="Halaman sebelumnya" ${st.page<=0?'disabled':''}>${I('left',14)}</button><span class="tabular">${st.page+1}/${pages}</span><button type="button" data-p="1" aria-label="Halaman berikutnya" ${st.page>=pages-1?'disabled':''}>${I('right',14)}</button></span>`;
      place(); const h=list.querySelector('.hi'); if(h) h.scrollIntoView({block:'nearest'}); }
    function choose(g){ const x=st.items[g]; if(!x||x.dis) return; sel.selectedIndex=x.i; paint(sel); close(true); sel.dispatchEvent(new Event('input',{bubbles:true})); sel.dispatchEvent(new Event('change',{bubbles:true})); }
    inp.addEventListener('input',()=>{ st.q=inp.value; st.page=0; st.hi=0; draw(); });
    inp.addEventListener('keydown',e=>{ const k=e.key;
      if(k==='Escape'){ e.preventDefault(); e.stopPropagation(); close(true); }
      else if(k==='Tab'){ close(false); }
      else if(k==='ArrowDown'||k==='ArrowUp'){ e.preventDefault(); const n=st.items.length; if(!n) return; st.hi=Math.min(n-1,Math.max(0,st.hi+(k==='ArrowDown'?1:-1))); st.page=Math.floor(st.hi/PS); draw(); }
      else if(k==='PageDown'||k==='PageUp'){ e.preventDefault(); st.page+=(k==='PageDown'?1:-1); st.hi=st.page*PS; draw(); }
      else if(k==='Enter'){ e.preventDefault(); choose(st.hi); } });
    pop.addEventListener('click',e=>{ const o=e.target.closest('.dd-opt'); if(o){ choose(+o.dataset.g); return; } const p=e.target.closest('[data-p]'); if(p){ st.page+=+p.dataset.p; st.hi=st.page*PS; draw(); inp.focus({preventScroll:true}); } });
    pop.addEventListener('mousemove',e=>{ const o=e.target.closest('.dd-opt'); if(o&&+o.dataset.g!==st.hi){ st.hi=+o.dataset.g; list.querySelectorAll('.dd-opt').forEach(n=>n.classList.toggle('hi',+n.dataset.g===st.hi)); } });
    const pos=all().findIndex(x=>x.i===sIdx); st.hi=Math.max(0,pos); st.page=Math.floor(st.hi/PS); draw();
    addEventListener('resize',place); addEventListener('scroll',onScroll,true); inp.focus({preventScroll:true}); }
  addEventListener('pointerdown',e=>{ if(cur&&!cur.pop.contains(e.target)&&!cur.btn.contains(e.target)) close(false); },true);
  enhanceAll();
})();
render(true);
</script>
