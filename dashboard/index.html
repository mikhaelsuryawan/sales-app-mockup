/* ---------- Dropdown dengan pencarian dan pagination ----------
   Semua <select> otomatis diganti tombol + panel. Select asli tetap ada (tersembunyi), jadi value, onchange, dan id tetap bekerja. */
(function(){
  /* Combobox: setiap <select> data diganti tombol + panel berpencarian. Semua kata yang diketik harus cocok.
     Di ponsel panel menjadi bottom sheet. Select asli tetap ada (tersembunyi) supaya value, id, dan onchange bekerja. */
  const CAP=100; let cur=null, seq=0;
  const vd=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  Object.defineProperty(HTMLSelectElement.prototype,'value',{configurable:true,get(){return vd.get.call(this)},set(v){ vd.set.call(this,v); if(this._ddPaint) this._ddPaint(); }});
  const label=sel=>{ const l=sel.closest('label'); const sp=l&&l.querySelector('span'); return (sel.getAttribute('aria-label')||(sp&&!sp.querySelector('select,.sel')?sp.textContent:'')||'').replace(/\s*\*\s*$/,'').trim(); };
  function paint(sel){ const b=sel._ddBtn; if(!b) return; const o=sel.options[sel.selectedIndex], t=o?o.text:'', ph=!o||o.value===''&&(!t||t==='–'); const tt=b.querySelector('.dd-t'); tt.textContent=ph?(sel.dataset.ph||'Pilih'):t; tt.classList.toggle('ph',!!ph); const n=label(sel); b.setAttribute('aria-label',(n?n+': ':'')+(ph?'Pilih':t)); b.disabled=sel.disabled; }
  function enhance(sel){ if(sel._dd||sel.hasAttribute('multiple')||sel.size>1) return; sel._dd=1;
    const b=document.createElement('button'); b.type='button'; b.className='dd-btn'; b.setAttribute('role','combobox'); b.setAttribute('aria-haspopup','listbox'); b.setAttribute('aria-expanded','false'); b.innerHTML='<span class="dd-t"></span>'+I('chev',16);
    if(sel.style.width) b.style.width=sel.style.width;
    sel.parentNode.insertBefore(b,sel); sel._ddBtn=b; sel._ddPaint=()=>paint(sel);
    sel.classList.add('dd-native'); sel.tabIndex=-1; sel.setAttribute('aria-hidden','true');
    b.addEventListener('click',e=>{ e.preventDefault(); cur&&cur.sel===sel?close(true):openDD(sel); });
    b.addEventListener('keydown',e=>{ if(['ArrowDown','ArrowUp'].includes(e.key)){ e.preventDefault(); openDD(sel); } });
    sel.addEventListener('change',()=>paint(sel));
    new MutationObserver(()=>paint(sel)).observe(sel,{childList:true,subtree:true,attributes:true,attributeFilter:['disabled','selected']});
    paint(sel); }
  function enhanceAll(root){ (root||document).querySelectorAll('select:not(.dd-native)').forEach(enhance); }
  let q=0; new MutationObserver(()=>{ if(q) return; q=setTimeout(()=>{ q=0; enhanceAll(); },0); }).observe(document.body,{childList:true,subtree:true});
  function close(refocus){ if(!cur) return; const {pop,btn,back}=cur; pop.remove(); back?.remove(); btn.setAttribute('aria-expanded','false'); btn.removeAttribute('aria-controls'); cur=null; removeEventListener('resize',place); removeEventListener('scroll',onScroll,true); if(refocus) btn.focus({preventScroll:true}); }
  function onScroll(e){ if(cur&&!cur.pop.contains(e.target)) place(); }
  function place(){ if(!cur||cur.phone) return; const {btn,pop}=cur, r=btn.getBoundingClientRect(); if(r.bottom<0||r.top>innerHeight){ close(false); return; }
    const w=Math.max(r.width,288), left=Math.max(12,Math.min(r.left,innerWidth-Math.min(w,innerWidth-24)-12)); pop.style.width=Math.min(w,innerWidth-24)+'px'; pop.style.left=left+'px';
    const list=pop.querySelector('.dd-list'); list.style.maxHeight=''; const chrome=pop.offsetHeight-list.offsetHeight, h=pop.offsetHeight, below=innerHeight-r.bottom-18, above=r.top-18;
    if(h>below&&above>below){ list.style.maxHeight=Math.max(120,Math.min(256,above-chrome))+'px'; pop.style.top=Math.max(12,r.top-6-pop.offsetHeight)+'px'; }
    else { list.style.maxHeight=Math.max(120,Math.min(256,below-chrome))+'px'; pop.style.top=(r.bottom+6)+'px'; } }
  function openDD(sel){ close(false); const btn=sel._ddBtn, pop=document.createElement('div'), phone=isPhone(), pid='ddp'+(++seq);
    pop.className='dd-pop'+(phone?' dd-sheet':''); pop.id=pid;
    pop.innerHTML=`<div class="dd-search">${I('search',16)}<input type="text" role="combobox" aria-expanded="true" aria-controls="${pid}-l" aria-autocomplete="list" aria-label="Cari opsi" placeholder="Cari…" autocomplete="off" autocorrect="off" spellcheck="false"><span class="cntr"></span></div><div class="dd-list" role="listbox" id="${pid}-l"></div><div class="dd-foot" hidden></div>`;
    let back=null; if(phone){ back=document.createElement('div'); back.className='overlay'; back.style.zIndex=199; back.addEventListener('pointerdown',e=>{ e.preventDefault(); close(true); }); document.body.appendChild(back); }
    document.body.appendChild(pop); btn.setAttribute('aria-expanded','true'); btn.setAttribute('aria-controls',pid+'-l');
    const st={sel,btn,pop,back,phone,q:'',hi:0,items:[]}; cur=st;
    const inp=pop.querySelector('input'), list=pop.querySelector('.dd-list'), foot=pop.querySelector('.dd-foot'), cntr=pop.querySelector('.cntr');
    const all=()=>[...sel.options].map((o,i)=>({i,t:o.text,dis:o.disabled,why:o.dataset.reason||'',desc:o.dataset.desc||''}));
    const total=all().length, sIdx=sel.selectedIndex; if(total>20) cntr.textContent='';
    const enabledFrom=(from,dir)=>{ for(let g=from;g>=0&&g<st.items.length;g+=dir) if(!st.items[g].dis) return g; return -1; };
    function draw(){ const words=st.q.trim().toLowerCase().split(/\s+/).filter(Boolean); st.items=all().filter(x=>words.every(w=>(x.t+' '+x.desc).toLowerCase().includes(w)));
      st.hi=Math.min(Math.max(st.hi,0),Math.max(0,st.items.length-1)); if(st.items[st.hi]?.dis){ const n=enabledFrom(st.hi,1); st.hi=n<0?st.hi:n; }
      const view=st.items.slice(0,CAP);
      list.innerHTML=view.length?view.map((x,g)=>{ const on=x.i===sel.selectedIndex; return `<button type="button" tabindex="-1" role="option" id="${pid}-o${g}" class="dd-opt ${g===st.hi?'hi':''}" aria-selected="${on}" ${x.dis?'aria-disabled="true"':''} data-g="${g}"><span class="dd-tx"><span>${esc(x.t||'–')}</span>${x.why||x.desc?`<small>${esc(x.dis&&x.why?x.why:x.desc)}</small>`:''}</span>${on?`<span class="dd-ck">${I('check',16,2.5)}</span>`:''}</button>`; }).join(''):`<div class="dd-empty">${st.q.trim()?`Tidak ada hasil untuk "${esc(st.q.trim())}"`:'Tidak ada pilihan'}</div>`;
      cntr.textContent=total>20?`${st.items.length} dari ${total}`:'';
      foot.hidden=st.items.length<=CAP; foot.innerHTML=`<span>Menampilkan ${CAP} dari ${st.items.length}. Ketik untuk mempersempit.</span>`;
      inp.setAttribute('aria-activedescendant',view.length?`${pid}-o${st.hi}`:''); place();
      const h=list.querySelector('.hi'); if(h){ const o=h.offsetTop; if(o<list.scrollTop) list.scrollTop=Math.max(0,o-4); else if(o+h.offsetHeight>list.scrollTop+list.clientHeight) list.scrollTop=o+h.offsetHeight-list.clientHeight+4; } }
    function choose(g){ const x=st.items[g]; if(!x||x.dis) return; sel.selectedIndex=x.i; paint(sel); close(true); sel.dispatchEvent(new Event('input',{bubbles:true})); sel.dispatchEvent(new Event('change',{bubbles:true})); }
    inp.addEventListener('input',()=>{ st.q=inp.value; st.hi=0; draw(); });
    inp.addEventListener('keydown',e=>{ const k=e.key;
      if(k==='Escape'){ e.preventDefault(); e.stopPropagation(); close(true); }
      else if(k==='Tab'){ close(false); }
      else if(k==='ArrowDown'||k==='ArrowUp'){ e.preventDefault(); const d=k==='ArrowDown'?1:-1, n=enabledFrom(st.hi+d,d); if(n>=0){ st.hi=n; draw(); } }
      else if(k==='PageDown'||k==='PageUp'){ e.preventDefault(); const d=k==='PageDown'?1:-1, n=enabledFrom(Math.max(0,Math.min(st.items.length-1,st.hi+8*d)),d); if(n>=0){ st.hi=n; draw(); } }
      else if(k==='Enter'){ e.preventDefault(); choose(st.hi); } });
    pop.addEventListener('mousedown',e=>{ if(e.target.closest('.dd-opt')) e.preventDefault(); });
    pop.addEventListener('click',e=>{ const o=e.target.closest('.dd-opt'); if(o) choose(+o.dataset.g); });
    pop.addEventListener('mousemove',e=>{ const o=e.target.closest('.dd-opt'); if(o&&+o.dataset.g!==st.hi&&o.getAttribute('aria-disabled')!=='true'){ st.hi=+o.dataset.g; list.querySelectorAll('.dd-opt').forEach(n=>n.classList.toggle('hi',+n.dataset.g===st.hi)); inp.setAttribute('aria-activedescendant',`${pid}-o${st.hi}`); } });
    const pos=all().findIndex(x=>x.i===sIdx); st.hi=Math.max(0,pos); draw();
    addEventListener('resize',place); addEventListener('scroll',onScroll,true); inp.focus({preventScroll:true}); }
  addEventListener('pointerdown',e=>{ if(cur&&!cur.phone&&!cur.pop.contains(e.target)&&!cur.btn.contains(e.target)) close(false); },true);
  enhanceAll();
})();
/* ---------- Penyimpanan data dashboard (D6) ----------
   Perubahan di dashboard disimpan sebagai snapshot berversi. Data bersama dengan mobile tetap di salesapp.shared.v1.
   Naikkan DASH_VER bila bentuk data contoh berubah, supaya snapshot lama dibuang dan data contoh baru dipakai. */
const DASH_VER=10;
const PARAM={};
const dashData=()=>({D,MD,TOKO,TRX,INFO,POSM,AR,KLAIM,ATT,REK_ADJ,PARAM});
function restoreInto(t,src){
  if(Array.isArray(t)&&Array.isArray(src)){ t.splice(0,t.length,...src); return; }
  for(const k of Object.keys(src)){ if(Array.isArray(t[k])&&Array.isArray(src[k])) t[k].splice(0,t[k].length,...src[k]); else t[k]=src[k]; }
}
function loadDash(){
  try{
    const raw=localStorage.getItem(KEY.data); if(!raw) return;
    const env=JSON.parse(raw);
    if(env?.version!==DASH_VER||!env.state){ localStorage.removeItem(KEY.data); return; }
    const cur=dashData(); for(const k of Object.keys(cur)) if(env.state[k]!=null) restoreInto(cur[k],env.state[k]);
    ID_SEQ=env.state.ID_SEQ||0;
  }catch(e){ try{ localStorage.removeItem(KEY.data); }catch(_){} }
}
let dashT=0, dashLast='';
function saveDash(){ clearTimeout(dashT); dashT=setTimeout(()=>{ const json=JSON.stringify({version:DASH_VER,state:{...dashData(),ID_SEQ}}); if(json===dashLast) return; if(writeKey(KEY.data,json)) dashLast=json; else storageFail(); },200); }
function resetAsk(){ openModal(`<h2 class="pt" style="font-size:18px">Reset data demo?</h2><p class="dlg-d">Semua perubahan di dashboard dan data bersama dengan aplikasi mobile di browser ini dihapus, lalu halaman dimuat ulang dengan data contoh awal.</p><div class="dlg-f">${btn('Batal',{v:'outline',on:'closeLayer()'})}${btn('Reset data demo',{v:'danger',icon:'refresh',on:'resetDemo()'})}</div>`); }
function resetDemo(){ try{ Object.keys(localStorage).filter(k=>k.startsWith('salesapp.')||k.startsWith('sim-')).forEach(k=>localStorage.removeItem(k)); }catch(e){} clearTimeout(dashT); location.reload(); }
